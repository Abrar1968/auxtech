name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mariadb]
    services:
      mariadb:
        image: mariadb:10.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: auxtech_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, intl, zip, pdo_mysql, pdo_sqlite, exif
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build

      - run: cp .env.example .env && php artisan key:generate

      - name: Code style
        run: vendor/bin/pint --test

      - name: Tests (SQLite)
        if: matrix.database == 'sqlite'
        run: vendor/bin/pest

      - name: Tests (MariaDB 10.4)
        if: matrix.database == 'mariadb'
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: auxtech_test
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: vendor/bin/pest

      - name: Migrations roll back and re-apply (MariaDB 10.4)
        if: matrix.database == 'mariadb'
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: auxtech_test
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: |
          php artisan migrate:fresh --force --seed
          php artisan migrate:reset --force
          php artisan migrate --force --seed

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: composer install --no-interaction --prefer-dist --no-dev
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Browser tests and SEO crawl
    runs-on: ubuntu-latest
    needs: frontend
    services:
      mariadb:
        image: mariadb:10.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: auxtech
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      APP_URL: http://127.0.0.1:8000
      ADMIN_PASSWORD: ci-admin-password-123
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, intl, zip, pdo_mysql, exif
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan migrate:fresh --force --seed

      # Firefox and WebKit projects are listed in playwright.config.ts but run locally, not here.
      - run: npx playwright install --with-deps chromium
      # PHP's built-in server, started directly (as `artisan serve` does, from public/) so that
      # its exit status and errors are visible. Playwright reuses it.
      - name: Start the PHP server
        run: |
          cd public
          nohup php -S 127.0.0.1:8000 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php > ../server.log 2>&1 &
          echo $! > ../server.pid
          sleep 2
          cd ..
          php -v | head -1; php -m | tr '\n' ' '; echo
          for path in / / /login /work /bn; do
            curl -s -m 30 -o body.html -w "$path status %{http_code} in %{time_total}s\n" "http://127.0.0.1:8000$path" || echo "$path curl exit code $?"
          done
          head -c 600 body.html; echo
          curl -sf -m 30 -o /dev/null http://127.0.0.1:8000/ && echo "server is up"

      - run: npx playwright test --project=desktop-chrome --project=android --trace off
        env:
          PW_EXTERNAL_SERVER: '1'

      - name: SEO crawl
        run: node scripts/seo-crawl.mjs http://127.0.0.1:8000

      - name: Server status and errors
        if: always()
        run: |
          if kill -0 "$(cat server.pid)" 2>/dev/null; then echo "server still running"; else echo "server process has exited"; fi
          tail -n 120 server.log || true
          ls -la storage/logs
          for f in storage/logs/*.log; do echo "== $f"; tail -n 60 "$f"; done

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
