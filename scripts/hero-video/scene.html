<!doctype html>
<!--
  Auxtech home page background video.
  Rendered frame by frame by scripts/hero-video/render.cjs (render(t) is a pure
  function of time, every motion repeats within LOOP seconds, so the video loops
  without a seam). Composition keeps the left side dark for the headline.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Inter; src: url('../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: Sora; src: url('../../node_modules/@fontsource-variable/sora/files/sora-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #26282c; font-family: Inter, sans-serif; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  canvas { position: absolute; inset: 0; }
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); }
  .panel { position: absolute; border-radius: 22px; background: rgba(49, 51, 56, 0.74); border: 1px solid rgba(255, 255, 255, 0.10);
           box-shadow: 0 40px 120px -40px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255,255,255,0.06); overflow: hidden; transform-style: preserve-3d; }
  .bar { height: 44px; display: flex; align-items: center; gap: 9px; padding: 0 18px; border-bottom: 1px solid rgba(255,255,255,0.07); }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .tab { margin-left: 14px; color: rgba(255,255,255,0.55); font-size: 15px; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }
  #code pre { font-family: ui-monospace, 'DejaVu Sans Mono', Menlo, monospace; font-size: 19px; line-height: 31px; padding: 18px 24px; color: #d9dadc; white-space: pre; }
  .k { color: #ffc93c; } .s { color: #ffe8a1; } .f { color: #ffffff; } .c { color: #85888f; } .n { color: #ffc93c; }
  .caret { display: inline-block; width: 10px; height: 22px; background: #ffc93c; vertical-align: -4px; }
  .label { color: rgba(255,255,255,0.5); font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; }
  .title { color: #fff; font-family: Sora, sans-serif; font-weight: 600; font-size: 22px; }
  .toast { position: absolute; display: flex; align-items: center; gap: 14px; padding: 16px 22px 16px 16px; border-radius: 18px;
           background: rgba(35, 36, 40, 0.86); border: 1px solid rgba(255,255,255,0.12); color: #fff; font-size: 18px; white-space: nowrap;
           box-shadow: 0 24px 60px -24px rgba(0,0,0,0.8); }
  .ico { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; font-weight: 700; font-size: 18px; }
  .sub { color: rgba(255,255,255,0.5); font-size: 14px; margin-top: 2px; }
  #veil { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(43,45,49,0.94) 0%, rgba(43,45,49,0.58) 34%, rgba(43,45,49,0) 62%),
          linear-gradient(0deg, rgba(43,45,49,0.88) 0%, rgba(43,45,49,0) 22%); }
  #phoneScreen { position: absolute; left: 10px; top: 10px; width: 256px; height: 436px; border-radius: 30px; overflow: hidden; background: #1e1f22; }
  #phoneScreen img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; transform-origin: 50% 0; }
  #notch { position: absolute; left: 50%; top: 16px; width: 64px; height: 17px; margin-left: -32px; border-radius: 12px; background: #1e1f22; z-index: 2; }
</style>
</head>
<body>
<div id="stage">
  <div class="glow" id="g1" style="width:900px;height:900px;background:#ffc93c;opacity:.10"></div>
  <div class="glow" id="g2" style="width:700px;height:700px;background:#d9dadc;opacity:.10"></div>
  <div class="glow" id="g3" style="width:460px;height:460px;background:#ffc93c;opacity:.09"></div>
  <canvas id="net" width="1920" height="1080"></canvas>

  <div class="panel" id="code" style="width:760px;height:430px;">
    <div class="bar"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span><span class="tab">platform/OrderService.ts</span></div>
    <pre id="codeText"></pre>
  </div>

  <div class="panel" id="dash" style="width:560px;height:330px;padding:26px 28px;">
    <div class="label">Live dashboard</div>
    <div class="title" style="margin-top:6px">Throughput</div>
    <canvas id="chart" width="504" height="210" style="position:absolute;left:28px;bottom:22px"></canvas>
  </div>

  <div class="panel" id="phone" style="width:276px;height:456px;border-radius:40px;background:#1e1f22;border-color:rgba(255,255,255,0.16)">
    <div id="phoneScreen"><div id="phoneCards" style="position:absolute;inset:0"></div></div>
    <div id="notch"></div>
  </div>

  <div class="toast" id="t1"><div class="ico" style="background:#16a34a33;color:#4ade80">✓</div><div>Tests passed<div class="sub">CI pipeline · main</div></div></div>
  <div class="toast" id="t2"><div class="ico" style="background:#ffc93c38;color:#ffc93c">↑</div><div>Deployed to production<div class="sub">Zero downtime release</div></div></div>
  <div class="toast" id="t3"><div class="ico" style="background:#d9dadc2e;color:#d9dadc">{}</div><div>API 200 OK<div class="sub">GET /v1/orders · 38 ms</div></div></div>

  <div id="veil"></div>
</div>
<script>
const LOOP = 12; // seconds; every motion below repeats within it
const TAU = Math.PI * 2;
const w = (t, period, phase = 0) => Math.sin(TAU * (t / period) + phase); // period must divide LOOP
const $ = (id) => document.getElementById(id);

// Deterministic pseudo-random numbers so every frame of every render is identical.
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const nodes = Array.from({ length: 46 }, () => ({ x: 760 + rnd() * 1160, y: 40 + rnd() * 1000, ax: 10 + rnd() * 26, ay: 10 + rnd() * 26, p: rnd() * TAU, per: [4, 6, 12][Math.floor(rnd() * 3)], r: 1.6 + rnd() * 2.4 }));
const edges = [];
nodes.forEach((a, i) => nodes.forEach((b, j) => { if (j > i && Math.hypot(a.x - b.x, a.y - b.y) < 230) edges.push([i, j]); }));
const pulses = edges.filter((_, i) => i % 5 === 0).map((e, i) => ({ e, speed: [1, 2, 3][i % 3], off: rnd() }));

const code = [
  ['<span class="k">export class</span> <span class="f">OrderService</span> {'],
  ['  <span class="k">async</span> <span class="f">place</span>(cart: Cart, customer: Customer) {'],
  ['    <span class="k">const</span> order = <span class="k">await</span> orders.<span class="f">create</span>({ cart, customer })'],
  ['    <span class="k">await</span> inventory.<span class="f">reserve</span>(order.items)'],
  ['    <span class="k">await</span> courier.<span class="f">book</span>(order, { cod: <span class="n">true</span> })'],
  ['    events.<span class="f">emit</span>(<span class="s">\'order.placed\'</span>, order)'],
  ['    <span class="k">return</span> order'],
  ['  }'],
  ['}'],
  [''],
  ['<span class="c">// all checks passing · ready to ship</span>'],
];
const plain = code.map(([h]) => h.replace(/<[^>]+>/g, ''));

function typed(t) {
  // Type for 9 s, hold, then fade out and restart at the loop point.
  const total = plain.reduce((n, l) => n + l.length + 1, 0);
  let chars = Math.floor(Math.min(1, t / 9) * total);
  const out = [];
  for (let i = 0; i < code.length; i++) {
    const len = plain[i].length;
    if (chars >= len) { out.push(code[i][0]); chars -= len + 1; continue; }
    if (chars > 0) { out.push(sliceHtml(code[i][0], chars) + '<span class="caret"></span>'); } else if (out.length === i) { out.push('<span class="caret"></span>'); }
    break;
  }
  return out.join('\n');
}
function sliceHtml(html, n) { // keep tags, cut visible text after n characters
  let out = '', seen = 0; const re = /(<[^>]+>)|([^<]+)/g; let m; const open = [];
  while ((m = re.exec(html))) {
    if (m[1]) { out += m[1]; if (!m[1].startsWith('</')) open.push(1); else open.pop(); continue; }
    const take = m[2].slice(0, Math.max(0, n - seen)); out += take; seen += take.length; if (seen >= n) break;
  }
  return out + '</span>'.repeat(open.length);
}

// Real mobile screenshots of Auxtech projects (set by render.cjs). Each holds
// for 2.4 s with a slow zoom, then slides aside for the next; four screens fill
// the 12 s loop, so the last slide lands on the first screen at the seam.
let screens = [];
window.setScreens = async (urls) => {
  const box = $('phoneCards'); box.innerHTML = '';
  screens = urls.map((src) => { const img = new Image(); img.src = src; box.appendChild(img); return img; });
  await Promise.all(screens.map((img) => img.decode()));
};
const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
function phoneScreens(t) {
  const n = screens.length, seg = LOOP / n, hold = seg - 0.6;
  const k = Math.floor(t / seg) % n, u = t - k * seg;
  const slide = u > hold ? ease((u - hold) / 0.6) : 0;
  screens.forEach((img, i) => {
    let x = 110, scale = 1, opacity = 0;
    if (i === k) { x = -100 * slide; scale = 1 + 0.05 * Math.min(u, hold) / hold; opacity = 1 - 0.4 * slide; }
    else if (i === (k + 1) % n && slide > 0) { x = 100 * (1 - slide); opacity = 1; }
    img.style.opacity = opacity; img.style.transform = `translateX(${x}%) scale(${scale})`; img.style.zIndex = i === k ? 1 : 2;
  });
}

function phoneCards(t) { // fallback when no screenshots are given
  const shift = ((t / LOOP) * 3) % 1;
  let html = '';
  for (let i = -1; i < 5; i++) {
    const y = (i - shift) * 118;
    const hue = ['#ffc93c', '#d9dadc', '#ffe8a1'][((i % 3) + 3) % 3];
    html += `<div style="position:absolute;left:14px;right:14px;top:${44 + y}px;height:104px;border-radius:18px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);display:flex;gap:12px;padding:14px">
      <div style="width:74px;border-radius:12px;background:linear-gradient(135deg,${hue},#2b2d31)"></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:9px;padding-top:6px"><div style="height:10px;width:80%;border-radius:6px;background:rgba(255,255,255,0.35)"></div><div style="height:8px;width:55%;border-radius:6px;background:rgba(255,255,255,0.18)"></div><div style="height:22px;width:62px;margin-top:6px;border-radius:8px;background:${hue}"></div></div></div>`;
  }
  return html;
}

function chart(t) {
  const c = $('chart').getContext('2d'); const W = 504, H = 210; c.clearRect(0, 0, W, H);
  c.strokeStyle = 'rgba(255,255,255,0.06)'; c.lineWidth = 1;
  for (let y = 0; y < 4; y++) { c.beginPath(); c.moveTo(0, 20 + y * 55); c.lineTo(W, 20 + y * 55); c.stroke(); }
  const bars = 14;
  for (let i = 0; i < bars; i++) {
    const h = 50 + 70 * (0.5 + 0.5 * w(t, 6, i * 0.7)) + 30 * (0.5 + 0.5 * w(t, 4, i));
    const x = i * (W / bars) + 6; const g = c.createLinearGradient(0, H - h, 0, H);
    g.addColorStop(0, 'rgba(217,218,220,0.85)'); g.addColorStop(1, 'rgba(217,218,220,0.10)');
    c.fillStyle = g; c.beginPath(); c.roundRect(x, H - h, W / bars - 14, h, 6); c.fill();
  }
  c.beginPath(); c.lineWidth = 3; c.strokeStyle = '#ffc93c';
  for (let x = 0; x <= W; x += 6) { const y = 118 + 22 * w(t + x / 80, 12, 0) + 10 * w(t + x / 40, 4, 1); x ? c.lineTo(x, y) : c.moveTo(x, y); }
  c.stroke();
}

function network(t) {
  const c = $('net').getContext('2d'); c.clearRect(0, 0, 1920, 1080);
  const pos = nodes.map((n) => [n.x + n.ax * w(t, n.per, n.p), n.y + n.ay * w(t, n.per, n.p + 1.3)]);
  c.lineWidth = 1;
  for (const [i, j] of edges) {
    const [ax, ay] = pos[i], [bx, by] = pos[j]; const d = Math.hypot(ax - bx, ay - by); if (d > 240) continue;
    c.strokeStyle = `rgba(217,218,220,${0.16 * (1 - d / 240)})`; c.beginPath(); c.moveTo(ax, ay); c.lineTo(bx, by); c.stroke();
  }
  for (const p of pulses) {
    const [i, j] = p.e; const f = ((t / LOOP) * p.speed + p.off) % 1;
    const x = pos[i][0] + (pos[j][0] - pos[i][0]) * f, y = pos[i][1] + (pos[j][1] - pos[i][1]) * f;
    const g = c.createRadialGradient(x, y, 0, x, y, 12); g.addColorStop(0, 'rgba(255,201,60,0.95)'); g.addColorStop(1, 'rgba(255,201,60,0)');
    c.fillStyle = g; c.beginPath(); c.arc(x, y, 12, 0, TAU); c.fill();
  }
  pos.forEach(([x, y], k) => { c.fillStyle = `rgba(232,233,235,${0.40 + 0.35 * (0.5 + 0.5 * w(t, nodes[k].per, nodes[k].p))})`; c.beginPath(); c.arc(x, y, nodes[k].r, 0, TAU); c.fill(); });
}

function place(id, x, y, rx = 0, ry = 0, extra = '') { $(id).style.transform = `translate(${x}px, ${y}px) perspective(1400px) rotateX(${rx}deg) rotateY(${ry}deg) ${extra}`; }

function toast(id, t, start, x, y) { // slides in, holds, leaves; repeats every LOOP
  const local = ((t - start) % LOOP + LOOP) % LOOP; const el = $(id);
  const a = local < 0.6 ? local / 0.6 : local < 3.4 ? 1 : local < 4 ? (4 - local) / 0.6 : 0;
  el.style.opacity = a; el.style.transform = `translate(${x + (1 - a) * 40}px, ${y}px)`;
}

window.render = (t) => {
  t = ((t % LOOP) + LOOP) % LOOP;
  $('g1').style.transform = `translate(${1150 + 120 * w(t, 12)}px, ${-260 + 80 * w(t, 12, 1)}px)`;
  $('g2').style.transform = `translate(${1350 + 100 * w(t, 12, 2)}px, ${520 + 70 * w(t, 6, 0.5)}px)`;
  $('g3').style.transform = `translate(${880 + 90 * w(t, 6, 1)}px, ${640 + 60 * w(t, 12, 2)}px)`;
  network(t);
  place('code', 900 + 10 * w(t, 12), 120 + 12 * w(t, 6), 4 + 1.5 * w(t, 12), -14 + 2 * w(t, 12, 1));
  const fade = t > 11.2 ? (12 - t) / 0.8 : t < 0.3 ? t / 0.3 : 1;
  $('codeText').innerHTML = typed(t); $('codeText').style.opacity = fade;
  place('dash', 1080 + 12 * w(t, 12, 2), 610 + 14 * w(t, 6, 1), -3, -10 + 2 * w(t, 12));
  chart(t);
  place('phone', 1590 + 8 * w(t, 6, 2), 330 + 18 * w(t, 12, 1), 2, -16 + 2 * w(t, 12, 2));
  if (screens.length) phoneScreens(t); else $('phoneCards').innerHTML = phoneCards(t);
  toast('t1', t, 1.0, 1290, 548);
  toast('t2', t, 5.0, 1160, 962);
  toast('t3', t, 9.0, 1500, 900);
};
render(0);
</script>
</body>
</html>
